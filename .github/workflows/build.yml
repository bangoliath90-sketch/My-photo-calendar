name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Get fonts
        run: bash scripts/get-fonts.sh

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the app file
        run: cp app/build/outputs/apk/release/app-release.apk "MyPhotoCalendar-v0.1.${{ github.run_number }}.apk"

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" \
            "MyPhotoCalendar-v0.1.${{ github.run_number }}.apk" \
            --title "My Photo Calendar v0.1.${{ github.run_number }}" \
            --notes "Download the .apk file below on your phone and open it to install." \
            --latest
